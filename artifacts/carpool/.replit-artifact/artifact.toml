kind = "web"
previewPath = "/"
title = "Carpooling App"
version = "1.0.0"
id = "artifacts/carpool"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 20057
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/carpool run dev"

[services.env]
PORT = "20057"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/carpool", "run", "build"]
publicDir = "artifacts/carpool/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
